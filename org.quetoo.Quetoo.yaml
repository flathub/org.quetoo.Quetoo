id: org.quetoo.Quetoo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: quetoo
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/physfs/physfs.json

  - name: Check
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/libcheck/check.git
        tag: 0.15.2
        commit: 11970a7e112dfe243a2e68773f014687df2900e8
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: Objectively
    sources:
      - type: git
        url: https://github.com/jdolan/Objectively.git
        commit: 65e27fa0bb64301cdf5bf60e729354c83a502b6b
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v2.0.23
      - type: shell
        commands:
          - autoreconf -vfi

  # Pinned past v0.10.0 on purpose. Quetoo v1.0.82 calls TransferBuffer::write,
  # which was added in e882666 after that tag, so building against v0.10.0 fails
  # with "TransferBufferInterface has no member named write". Restore the tag
  # pin once a release ships containing it.
  - name: ObjectivelyGPU
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyGPU.git
        commit: b1548b575fa66114df87c64a1c30f4b7a4885089
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v1.0.0
      - type: shell
        commands:
          - autoreconf -vfi

  - name: ObjectivelyMVC
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyMVC.git
        commit: c1d32c0b62cdf71dddcc4989bc7a9fdcca244462
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v2.1.7
      - type: shell
        commands:
          - autoreconf -vfi

  - name: Quetoo-Data
    buildsystem: simple
    build-commands:
      - cp -a target /app/share/quetoo
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo-data.git
        commit: 90a1b04523f1e2b5b89ad0b33c505fcbf1c25a29
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true

        tag: v1.0.30
  - name: Quetoo
    build-options:
      env:
        CFLAGS: ''
    config-opts:
      - --enable-optimizations=expensive
      - --disable-debug
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo.git
        tag: v1.0.84
        commit: ac6989fd174d1b69ff85e966b02e85e5faa816d7
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true
          is-main-source: true
      - type: shell
        commands:
          - autoreconf -vfi
      - type: file
        path: org.quetoo.Quetoo.metainfo.xml
      - type: file
        path: org.quetoo.Quetoo.png
    post-install:
      - install -Dm644 org.quetoo.Quetoo.metainfo.xml -t /app/share/metainfo
      - install -Dm644 org.quetoo.Quetoo.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 linux/quetoo/Quetoo.desktop /app/share/applications/org.quetoo.Quetoo.desktop
      - desktop-file-edit --set-icon=org.quetoo.Quetoo /app/share/applications/org.quetoo.Quetoo.desktop
