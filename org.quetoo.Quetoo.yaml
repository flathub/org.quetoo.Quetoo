id: org.quetoo.Quetoo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: quetoo
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/physfs/physfs.json

  - name: Check
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/libcheck/check.git
        tag: 0.15.2
        commit: 11970a7e112dfe243a2e68773f014687df2900e8
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: Objectively
    sources:
      - type: git
        url: https://github.com/jdolan/Objectively.git
        commit: 08335353c1a181340389c405a2e895702f0ec968
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v2.0.12
      - type: shell
        commands:
          - autoreconf -vfi

  - name: ObjectivelyGPU
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyGPU.git
        commit: 39d2527d301b83a2c60bb0129ce7c5825446a37e
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v0.6.0
      - type: shell
        commands:
          - autoreconf -vfi

  - name: ObjectivelyMVC
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyMVC.git
        commit: 384049ae150f30b5c9dfaca48b0bda171124bbaf
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v2.1.2
      - type: shell
        commands:
          - autoreconf -vfi

  - name: Quetoo-Data
    buildsystem: simple
    build-commands:
      - cp -a target /app/share/quetoo
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo-data.git
        tag: v1.0.21
        commit: c850bb37f6db6231a7e8211a241d32ec16efd664
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true

  - name: Quetoo
    build-options:
      env:
        CFLAGS: ''
    config-opts:
      - --enable-optimizations=expensive
      - --disable-debug
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo.git
        tag: v1.0.59
        commit: 1348f1b9dc5c71503c8e5e71fcdd0049c474631a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true
          is-main-source: true
      - type: shell
        commands:
          - autoreconf -vfi
      - type: file
        path: org.quetoo.Quetoo.metainfo.xml
      - type: file
        path: org.quetoo.Quetoo.png
    post-install:
      - install -Dm644 org.quetoo.Quetoo.metainfo.xml -t /app/share/metainfo
      - install -Dm644 org.quetoo.Quetoo.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 linux/quetoo/Quetoo.desktop /app/share/applications/org.quetoo.Quetoo.desktop
      - desktop-file-edit --set-icon=org.quetoo.Quetoo /app/share/applications/org.quetoo.Quetoo.desktop
