id: org.quetoo.Quetoo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: quetoo
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/physfs/physfs.json

  - name: Check
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/libcheck/check.git
        tag: 0.15.2
        commit: 11970a7e112dfe243a2e68773f014687df2900e8
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: Objectively
    sources:
      - type: git
        url: https://github.com/jdolan/Objectively.git
        tag: v2.4.1
        commit: 54d510ae75b7220a6d3210485a986fc9bb40ffda
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: shell
        commands:
          - autoreconf -vfi

  - name: ObjectivelyGPU
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyGPU.git
        tag: v2.2.9
        commit: e8f373d26a1f863cc7aa9cc13d17ecff5ec154f8
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: shell
        commands:
          - autoreconf -vfi

  - name: ObjectivelyMVC
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyMVC.git
        tag: v2.5.12
        commit: 41df87ca970141d7994e368b339aae921aa01ea2
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: shell
        commands:
          - autoreconf -vfi

  - name: Quetoo-Data
    buildsystem: simple
    build-commands:
      - cp -a target /app/share/quetoo
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo-data.git
        tag: v1.0.67
        commit: 8d93597f996458a651ab46b5b8b42c8958f0a594
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true

  - name: Quetoo
    build-options:
      env:
        CFLAGS: ''
    config-opts:
      - --enable-optimizations=expensive
      - --disable-debug
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo.git
        tag: v1.0.138
        commit: 965aaa249f115e8c6f57a30c377a9c9dc91505d2
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true
          is-main-source: true
      - type: shell
        commands:
          - autoreconf -vfi
      - type: file
        path: org.quetoo.Quetoo.metainfo.xml
      - type: file
        path: org.quetoo.Quetoo.png
    post-install:
      - install -Dm644 org.quetoo.Quetoo.metainfo.xml -t /app/share/metainfo
      - install -Dm644 org.quetoo.Quetoo.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 linux/quetoo/Quetoo.desktop /app/share/applications/org.quetoo.Quetoo.desktop
      - desktop-file-edit --set-icon=org.quetoo.Quetoo /app/share/applications/org.quetoo.Quetoo.desktop
