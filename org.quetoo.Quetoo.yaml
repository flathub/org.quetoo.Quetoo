id: org.quetoo.Quetoo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: quetoo
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/physfs/physfs.json

  - name: Check
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/libcheck/check.git
        tag: 0.15.2
        commit: 11970a7e112dfe243a2e68773f014687df2900e8
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: Objectively
    sources:
      - type: git
        url: https://github.com/jdolan/Objectively.git
        tag: v2.0.10
        commit: 62d096d222a0eb159f86835487305acecdfac5a9
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: shell
        commands:
          - autoreconf -vfi

  - name: ObjectivelyMVC
    sources:
      - type: git
        url: https://github.com/jdolan/ObjectivelyMVC.git
        tag: v1.0.8
        commit: 4bd24e96a10017d3f0fe86f67f327bff52ff9cfc
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: shell
        commands:
          - autoreconf -vfi

  - name: Quetoo-Data
    buildsystem: simple
    build-commands:
      - cp -a target /app/share/quetoo
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo-data.git
        tag: v1.0.19
        commit: 197932e94faddb9b2d06d689e4faf561cd582f1a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true

  - name: Quetoo
    build-options:
      env:
        CFLAGS: ''
    config-opts:
      - --enable-optimizations=expensive
      - --disable-debug
    sources:
      - type: git
        url: https://github.com/jdolan/quetoo.git
        tag: v1.0.55
        commit: ff9591e3a2d836016cf7a1886e3f67876fe0c4c9
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-important: true
          is-main-source: true
      - type: shell
        commands:
          - autoreconf -vfi
      - type: file
        path: org.quetoo.Quetoo.metainfo.xml
      - type: file
        path: org.quetoo.Quetoo.png
    post-install:
      - install -Dm644 org.quetoo.Quetoo.metainfo.xml -t /app/share/metainfo
      - install -Dm644 org.quetoo.Quetoo.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 linux/quetoo/Quetoo.desktop /app/share/applications/org.quetoo.Quetoo.desktop
      - desktop-file-edit --set-icon=org.quetoo.Quetoo /app/share/applications/org.quetoo.Quetoo.desktop
